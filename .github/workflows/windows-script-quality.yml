name: Repository Script Quality

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-script-quality-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate all repository scripts
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out entire repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Inventory every tracked file and validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = @(git ls-files)
          if ($tracked.Count -eq 0) { throw 'No tracked repository files were found.' }
          $extensions = @('.ps1','.psm1','.psd1','.bat','.cmd','.vbs','.wsf','.py','.js','.mjs','.cjs','.sh','.bash','.rb')
          $scripts = @($tracked | Where-Object { [IO.Path]::GetExtension($_).ToLowerInvariant() -in $extensions })
          Write-Host ("Repository inventory: {0} tracked files; {1} script files." -f $tracked.Count,$scripts.Count)
          $scripts | ForEach-Object { Write-Host ("SCRIPT: {0}" -f $_) }

          $psFiles = @($tracked | Where-Object { [IO.Path]::GetExtension($_).ToLowerInvariant() -in @('.ps1','.psm1','.psd1') })
          $psErrors = @()
          foreach ($path in $psFiles) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $path),[ref]$tokens,[ref]$parseErrors) | Out-Null
            foreach ($issue in $parseErrors) {
              $psErrors += ("{0}:{1}:{2} {3}" -f $path,$issue.Extent.StartLineNumber,$issue.Extent.StartColumnNumber,$issue.Message)
            }
          }
          Write-Host ("PowerShell syntax checked: {0}" -f $psFiles.Count)
          if ($psErrors.Count -gt 0) {
            $psErrors | ForEach-Object { Write-Host ("ERROR: " + $_) }
            throw ("Found {0} PowerShell syntax error(s) across the repository." -f $psErrors.Count)
          }

      - name: Validate Python syntax in every tracked Python file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(git ls-files | Where-Object { [IO.Path]::GetExtension($_).ToLowerInvariant() -eq '.py' })
          foreach ($file in $files) {
            python -m py_compile "$file"
            if ($LASTEXITCODE -ne 0) { throw "Python syntax check failed: $file" }
          }
          Write-Host ("Python syntax checked: {0}" -f $files.Count)

      - name: Validate JavaScript syntax in every tracked JS file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(git ls-files | Where-Object { [IO.Path]::GetExtension($_).ToLowerInvariant() -in @('.js','.mjs','.cjs') })
          foreach ($file in $files) {
            # Parse through stdin as an ES module so import/export files are checked
            # correctly even when they live outside a package.json with type=module.
            Get-Content -LiteralPath $file -Raw | node --check --input-type=module
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $file" }
          }
          Write-Host ("JavaScript syntax checked: {0}" -f $files.Count)

      - name: Validate shell and Ruby syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shellFiles = @(git ls-files | Where-Object { [IO.Path]::GetExtension($_).ToLowerInvariant() -in @('.sh','.bash') })
          foreach ($file in $shellFiles) {
            bash -n "$file"
            if ($LASTEXITCODE -ne 0) { throw "Shell syntax check failed: $file" }
          }
          $rubyFiles = @(git ls-files | Where-Object { [IO.Path]::GetExtension($_).ToLowerInvariant() -eq '.rb' })
          foreach ($file in $rubyFiles) {
            ruby -c "$file"
            if ($LASTEXITCODE -ne 0) { throw "Ruby syntax check failed: $file" }
          }
          Write-Host ("Shell syntax checked: {0}; Ruby syntax checked: {1}" -f $shellFiles.Count,$rubyFiles.Count)

      - name: Inspect every Batch, CMD, VBScript and WSF file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(git ls-files | Where-Object { [IO.Path]::GetExtension($_).ToLowerInvariant() -in @('.bat','.cmd','.vbs','.wsf') })
          $invalid = @()
          foreach ($path in $files) {
            $text = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE $path))
            if ([string]::IsNullOrWhiteSpace($text) -or $text.Contains([char]0)) {
              $invalid += $path
              Write-Host ("INVALID: {0} is empty or contains NUL bytes." -f $path)
            }
          }
          Write-Host ("Batch/CMD/VBS/WSF files inspected: {0}" -f $files.Count)
          if ($invalid.Count -gt 0) { throw ("Invalid script files: " + ($invalid -join ', ')) }

      - name: Run explicitly CI-safe Windows scripts across the repository
        shell: pwsh
        env:
          CI: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = @(git ls-files)
          $psFiles = @($tracked | Where-Object { [IO.Path]::GetExtension($_).ToLowerInvariant() -eq '.ps1' })
          foreach ($path in $psFiles) {
            $full = Join-Path $env:GITHUB_WORKSPACE $path
            $head = (Get-Content -LiteralPath $full -TotalCount 5) -join [Environment]::NewLine
            if ($head -match '(?im)^\s*#\s*CI-SAFE:') {
              Write-Host ("PowerShell test: {0}" -f $path) -ForegroundColor Cyan
              $p = Start-Process -FilePath 'pwsh' -ArgumentList @('-NoProfile','-NonInteractive','-File',('"' + $full + '"'),'-CI') -PassThru -NoNewWindow
              if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "Timed out: $path" }
              if ($p.ExitCode -ne 0) { throw "PowerShell test failed: $path (exit $($p.ExitCode))" }
            }
          }

          $batchFiles = @($tracked | Where-Object { [IO.Path]::GetExtension($_).ToLowerInvariant() -in @('.bat','.cmd') })
          foreach ($path in $batchFiles) {
            $full = Join-Path $env:GITHUB_WORKSPACE $path
            $head = (Get-Content -LiteralPath $full -TotalCount 5) -join [Environment]::NewLine
            if ($head -match '(?im)^\s*::\s*CI-SAFE\b') {
              Write-Host ("Batch test: {0}" -f $path) -ForegroundColor Cyan
              $p = Start-Process -FilePath $env:ComSpec -ArgumentList ('/d /c call "' + $full + '" --ci') -PassThru -NoNewWindow
              if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "Timed out: $path" }
              if ($p.ExitCode -ne 0) { throw "Batch test failed: $path (exit $($p.ExitCode))" }
            }
          }

          $vbsFiles = @($tracked | Where-Object { [IO.Path]::GetExtension($_).ToLowerInvariant() -eq '.vbs' })
          foreach ($path in $vbsFiles) {
            $full = Join-Path $env:GITHUB_WORKSPACE $path
            $head = (Get-Content -LiteralPath $full -TotalCount 5) -join [Environment]::NewLine
            if ($head -match "(?im)^\s*'\s*CI-SAFE\b") {
              Write-Host ("VBScript test: {0}" -f $path) -ForegroundColor Cyan
              $p = Start-Process -FilePath (Join-Path $env:WINDIR 'System32\cscript.exe') -ArgumentList ('//nologo "' + $full + '" --ci') -PassThru -NoNewWindow
              if (-not $p.WaitForExit(15000)) { $p.Kill(); throw "Timed out: $path" }
              if ($p.ExitCode -ne 0) { throw "VBScript test failed: $path (exit $($p.ExitCode))" }
            }
          }
          Write-Host 'Finished all marked, non-destructive Windows script smoke tests.'
